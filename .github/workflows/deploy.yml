# Builds the Astro/Lumos site and publishes it to GitHub Pages
# every time you push to main (or when you run it by hand from the Actions tab).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Astro site
        uses: withastro/action@v2
        with:
          # Match the major version you get from `node -v` locally.
          node-version: 22
          # Package manager is auto-detected from your lockfile,
          # so make sure package-lock.json (or pnpm-lock.yaml) is committed.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
